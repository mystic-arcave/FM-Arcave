# FM-ARCAVE: build the FM-1 package on GitHub, run the tests, and on a tag vX.Y publish the release with a build
# attestation (the Firmware Hub shows "Built from source" for exactly these files). After Dinghy's workflow: the
# JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com.
# Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install Pillow
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh
      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK
      - name: Build
        run: |
          sh build.sh
          sh web/emu/build.sh dev
      - name: Tests
        run: sh tests/run_arcave_tests.sh
      - name: Release package (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh build.sh --release "$V"
          (cd build && sha256sum fm-arcave-"$V".fwsc > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: fm-arcave-fwsc
          path: build/fm-arcave*.fwsc
          if-no-files-found: error
      - name: Attest the package (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/fm-arcave-[0-9]*.fwsc
      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/fm-arcave-[0-9]*.fwsc
            build/SHA256SUMS
          generate_release_notes: true
